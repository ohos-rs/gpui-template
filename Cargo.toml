[package]
name = "gpui-template"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Minimal GPUI + OpenHarmony (OHOS) Rust template"
readme = "README.md"

[lib]
crate-type = ["cdylib"]

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "e30095febcfd25ae81d52e59d7d80c2bd21830c6", default-features = false }
gpui-ohos = { git = "https://github.com/ohos-rs/gpui-ohos", rev = "46ebefc95115a16fb618315431adcef8bd324c59" }
openharmony-ability = { git = "https://github.com/harmony-contrib/openharmony-ability.git", rev = "8d66b703f9044a966eaedd720a61ed797049982d", version = "=1.0.0-beta.3" }
openharmony-ability-derive = { git = "https://github.com/harmony-contrib/openharmony-ability.git", rev = "8d66b703f9044a966eaedd720a61ed797049982d", version = "=1.0.0-beta.3" }

napi-ohos = "=1.2.0"
napi-derive-ohos = "=1.2.0"

ohos-hilog-binding = { version = "0.2.3", features = ["log"] }
log = "0.4"

[build-dependencies]
napi-build-ohos = "=1.2.0"
