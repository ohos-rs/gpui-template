[package]
name = "gpui-template"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Minimal GPUI + OpenHarmony (OHOS) Rust template"
readme = "README.md"

[lib]
crate-type = ["cdylib"]

[dependencies]
gpui = { git = "https://github.com/ohos-rs/zed.git", rev = "8fd5825db571d1bfd8504672940736787ea3acf2", version = "=0.2.2" }
gpui_platform = { git = "https://github.com/ohos-rs/zed.git", rev = "8fd5825db571d1bfd8504672940736787ea3acf2" }
openharmony-ability = { version = "1.0.0-beta.2" }
openharmony-ability-derive = { version = "1.0.0-beta.1" }

gpui-component = { git = "https://github.com/longbridge/gpui-component.git", rev = "9890a77c2d427f05b2512f05ddc6cce84686f9a6" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component.git", rev = "9890a77c2d427f05b2512f05ddc6cce84686f9a6" }
gpui-router = { version = "0.3" }
rust-embed = { version = "8.12.0", features = ["debug-embed"] }

napi-ohos = { version = "=1.2.0" }
napi-derive-ohos = { version = "=1.2.0" }
napi-derive-backend-ohos = { version = "=1.2.0" }

ohos-hilog-binding = { version = "0.2.3", features = ["log"] }
log = { version = "0.4.34" }

[build-dependencies]
napi-build-ohos = { version = "=1.2.0" }

[patch.crates-io]
gpui = { git = "https://github.com/ohos-rs/zed.git", rev = "8fd5825db571d1bfd8504672940736787ea3acf2", version = "=0.2.2" }
gpui_platform = { git = "https://github.com/ohos-rs/zed.git", rev = "8fd5825db571d1bfd8504672940736787ea3acf2" }
gpui_macros = { git = "https://github.com/ohos-rs/zed.git", rev = "8fd5825db571d1bfd8504672940736787ea3acf2" }
# gpui-router 0.3.0 needs this RenderOnce disambiguation with current GPUI.
gpui-router = { path = "vendor/gpui-router" }

[patch."https://github.com/zed-industries/zed.git"]
gpui = { git = "https://github.com/ohos-rs/zed.git", rev = "8fd5825db571d1bfd8504672940736787ea3acf2", version = "=0.2.2" }
gpui_platform = { git = "https://github.com/ohos-rs/zed.git", rev = "8fd5825db571d1bfd8504672940736787ea3acf2" }
gpui_macros = { git = "https://github.com/ohos-rs/zed.git", rev = "8fd5825db571d1bfd8504672940736787ea3acf2" }

